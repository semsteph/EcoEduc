[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # L'app (Vuetify en autoImport + gros bundles) dépasse la limite mémoire
  # par défaut de Node pendant le build du bundle Nitro/Netlify sans ça :
  # testé et confirmé nécessaire (crash "JavaScript heap out of memory" sans).
  NODE_OPTIONS = "--max-old-space-size=4096"

# Le proxy vers le backend (/api, /uploads) est géré par Nuxt lui-même via
# routeRules dans nuxt.config.ts (API_BACKEND_URL) — pas ici : les redirects
# netlify.toml sont court-circuités par le catch-all SSR généré par le preset
# Netlify de Nitro, testé et confirmé non fonctionnel pour ce cas précis.
